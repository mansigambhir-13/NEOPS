# Render Blueprint — deploy NEOP as ONE web service (plane + console, same origin).
# Docs: https://render.com/docs/blueprint-spec
#
# Before first deploy (see DEPLOY.md):
#   1. Set OPENROUTER_API_KEY in the Render dashboard (sync: false keeps it out of git).
#   2. NEOP_ADMIN_TOKEN is generated by Render — read it from the dashboard; the
#      console prompts for it once and stores it in the browser.
#   3. The disk at /data holds the journal — approvals and parked runs survive
#      deploys and restarts. Without it Render's filesystem is EPHEMERAL.

services:
  - type: web
    name: neop
    runtime: node
    plan: starter # $7/mo; free tier sleeps and has no disks — parked gates would die
    buildCommand: |
      npm ci && npm run build
      cd web && npm ci && VITE_NEOP_API_BASE=/ npm run build
    startCommand: node dist/bin/serve.js
    healthCheckPath: /health
    disk:
      name: neop-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NEOP_MODE
        value: live
      - key: NEOP_PROVIDER
        value: openrouter
      - key: NEOP_WORK_MODEL
        value: openai/gpt-5.2
      - key: NEOP_VERIFY_MODEL
        value: openai/gpt-4o-mini
      - key: NEOP_DATA_DIR
        value: /data
      - key: NEOP_ADMIN_TOKEN
        generateValue: true # Render mints it; read it in the dashboard
      - key: OPENROUTER_API_KEY
        sync: false # set by hand in the dashboard — never in git
